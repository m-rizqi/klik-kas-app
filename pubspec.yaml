name: klik_kas
description: "Finance Cash Flow App"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bloc: ^9.2.0
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  get: ^4.7.3
  get_it: ^9.2.1
  image: ^4.8.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  json_annotation: ^4.11.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  shimmer: ^3.0.0
  go_router: ^17.2.1
  google_fonts: ^8.0.2
  dartz: ^0.10.1
  styled_text: ^9.0.0
  faker: ^2.2.0
  sliver_tools: ^0.2.12
  uuid: ^4.5.3
  supabase_flutter: ^2.12.4
  copy_with_extension: ^14.0.0
  chucker_flutter: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.13.1
  flutter_gen_runner: ^5.13.0+1
  flutter_launcher_icons: ^0.14.4
  json_serializable: ^6.13.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0
  copy_with_extension_gen: ^14.0.0
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.example
    - .env.development
    - .env.staging
    - .env.production
    - assets/images/
    - assets/svg/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

flutter_gen:
  output: lib/gen/
  line_length: 100
  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/klikkas_logo.png"
  # For Android 8.0+, you can provide a background color for adaptive icons
  adaptive_icon_background: "#00677D"
  adaptive_icon_foreground: "assets/images/klikkas_logo.png"

flutter_native_splash:
  color: "#00677D"
  image: "assets/images/klikkas_logo.png"
  #  branding: "assets/images/branding_text.png" # Optional: "Powered by..."

  android_12:
    image: "assets/images/klikkas_logo.png"
    icon_background_color: "#00677D"
  fullscreen: true

targets:
  $default:
    builders:
      json_serializable:
        generate_for:
          exclude:
            - lib/generated/**
            - lib/**/*.g.dart
      source_gen|combining_builder:
        generate_for:
          exclude:
            - lib/generated/**